name: taskflow
description: Cross-platform task management app for hardware test engineers.
publish_to: 'none'
version: 1.4.87+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # UI
  flutter_animate: ^4.5.0
  window_manager: ^0.4.2
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4
  url_launcher: ^6.2.6
  flutter_math_fork: ^0.7.3
  markdown: ^7.2.2

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  collection: ^1.18.0
  meta: ^1.11.0
  file_picker: ^8.1.2
  path: ^1.9.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  # Bundled fonts (v1.4.29 aesthetics): Inter for Latin, HarmonyOS Sans SC
  # for CJK. Bundling both gives consistent, modern mixed Chinese/English
  # rendering on every machine (no dependence on which system fonts happen
  # to be installed). Weights are kept minimal to bound app size.
  fonts:
    # English / Latin — Inter (open source, SIL OFL)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Chinese / CJK — HarmonyOS Sans SC (Huawei, free for commercial use)
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
