name: taskflow
description: Cross-platform task management app for hardware test engineers.
publish_to: 'none'
version: 1.6.4+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # UI
  flutter_animate: ^4.5.0
  window_manager: ^0.4.2
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4
  url_launcher: ^6.2.6
  flutter_math_fork: ^0.7.3
  markdown: ^7.2.2

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  collection: ^1.18.0
  meta: ^1.11.0
  file_picker: ^8.1.2
  path: ^1.9.0
  shared_preferences: ^2.5.3

  # v1.6.0: AI Parse file parsing — OOXML (docx/xlsx/pptx) are ZIP+XML
  # containers; PDF text extraction is pure Dart (no native DLLs).
  archive: ^4.2.0
  xml: ^6.5.0
  pdf_document: ^0.1.0
  pdf_graphics: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  # Bundled fonts (v1.5.2 font upgrade — Manrope × MiSans):
  #  - Manrope: Latin primary, VARIABLE font (single file covers wght
  #    200–800, OFL 1.1 — see assets/fonts/FONT_LICENSES.md).
  #  - MiSans: CJK primary (Xiaomi, free for commercial use), 3 weights.
  #  - HarmonyOS Sans SC: CJK safety-net fallback, Regular only.
  fonts:
    # English / Latin — Manrope variable font.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    # Chinese / CJK — MiSans (Xiaomi, free for commercial use).
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
    # Chinese / CJK fallback — HarmonyOS Sans SC (Huawei, free for
    # commercial use); Regular only to bound app size.
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400

  assets:
    # Font license declarations shipped with the app (v1.5.2).
    - assets/fonts/FONT_LICENSES.md
