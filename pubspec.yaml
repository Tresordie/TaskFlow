name: taskflow
description: Cross-platform task management app for hardware test engineers.
publish_to: 'none'
version: 1.15.3+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # UI
  flutter_animate: ^4.5.0
  window_manager: ^0.4.2
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4
  url_launcher: ^6.2.6
  flutter_math_fork: ^0.7.3
  markdown: ^7.2.2

  # Utils
  # v1.12.63: direct dep — the single-instance guard raises the running
  # instance's window via user32 FFI (malloc / toNativeUtf16).
  ffi: ^2.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  collection: ^1.18.0
  meta: ^1.11.0
  file_picker: ^8.1.2
  path: ^1.9.0
  shared_preferences: ^2.5.3

  # v1.6.0: AI Parse file parsing — OOXML (docx/xlsx/pptx) are ZIP+XML
  # containers; PDF text extraction is pure Dart (no native DLLs).
  archive: ^4.2.0
  xml: ^6.5.0
  pdf_document: ^0.1.0
  pdf_graphics: ^0.1.0

  # v1.15.0 AI Parse upgrade:
  #  - sherpa_onnx: local SenseVoice speech recognition (bundled offline
  #    model, official k2-fsa Flutter bindings with prebuilt native libs
  #    for Windows/macOS/iOS).
  #  - webview_flutter / webview_windows: mermaid + SVG rendering of AI
  #    output (WKWebView on iOS/macOS, WebView2 on Windows).
  #  - audio_decoder: local FFI plugin — decodes audio files to the raw
  #    16 kHz mono PCM the recognizer consumes (miniaudio + Media
  #    Foundation on Windows, + AudioToolbox on Apple).
  sherpa_onnx: ^2.0.3
  webview_flutter: ^4.14.1
  # webview_windows is VENDORED (path dep): upstream 0.4.0 uses std::format
  # (<format>, C++20), which needs MSVC >= 14.32 — this repo builds with
  # VS2022 17.0 / toolset 14.30, so plugins/webview_windows carries a small
  # patch replacing the 4 std::format call sites with plain concatenation.
  # See plugins/webview_windows/VENDORED.md.
  webview_windows:
    path: plugins/webview_windows
  audio_decoder:
    path: plugins/audio_decoder
  flutter_svg: ^2.5.1
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  # Bundled fonts (v1.5.2 font upgrade — Manrope × MiSans):
  #  - Manrope: Latin primary, VARIABLE font (single file covers wght
  #    200–800, OFL 1.1 — see assets/fonts/FONT_LICENSES.md).
  #  - MiSans: CJK primary (Xiaomi, free for commercial use), 3 weights.
  #  - HarmonyOS Sans SC: CJK safety-net fallback, Regular only.
  fonts:
    # English / Latin — Manrope variable font.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    # Chinese / CJK — MiSans (Xiaomi, free for commercial use).
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
    # Chinese / CJK fallback — HarmonyOS Sans SC (Huawei, free for
    # commercial use); Regular only to bound app size.
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400

  assets:
    # Font license declarations shipped with the app (v1.5.2).
    - assets/fonts/FONT_LICENSES.md

    # v1.15.0 AI Parse upgrade:
    #  - mermaid.min.js renders ```mermaid / ```svg blocks of AI output
    #    inside the app WebView and in exported HTML (no CDN, offline).
    #    v1.15.2: upgraded 11.17.2 → 12.3.0, the reference project's version.
    #  - svg_fit.js (v1.15.2): model-SVG text-overflow repair, JS port of
    #    the reference richRender.ts fitSvgText — runs in the headless
    #    export renderer WebView.
    #  - SenseVoice int8 ASR model bundled with the app (user decision):
    #    fetched by scripts/fetch_asr_model.ps1 — NOT committed to git,
    #    so run the script once before building.
    - assets/mermaid/mermaid.min.js
    - assets/mermaid/svg_fit.js
    - assets/models/sensevoice/tokens.txt
    - assets/models/sensevoice/model.int8.onnx



